[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fundbest-protobuf"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = [
   "protobuf==6.33.5"
]

[tool.setuptools.packages.find]
where = ["gen/python"]
include = ["fundbest*"]
namespaces = true